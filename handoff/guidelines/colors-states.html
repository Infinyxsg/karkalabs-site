<!-- @dsCard group="Colors" viewport="700x120" name="State colours" subtitle="Secured = sage tint; pending/held = olive tint — neutral, never red" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--color-paper);font-family:var(--font-sans);color:var(--color-ink)}</style></head><body><div style="display:flex;gap:12px;flex-wrap:wrap">
<span style="display:inline-flex;align-items:center;gap:8px;min-height:32px;border-radius:9999px;background:var(--color-sage-tint);color:var(--color-sage-deep);padding:0 12px;font-size:13px;font-weight:600"><span style="width:8px;height:8px;border-radius:50%;background:var(--color-sage-deep)"></span>secured</span>
<span style="display:inline-flex;align-items:center;gap:8px;min-height:32px;border-radius:9999px;background:var(--color-olive-tint);color:var(--color-ink);padding:0 12px;font-size:13px;font-weight:600"><span style="width:8px;height:8px;border-radius:50%;background:var(--color-olive)"></span>waiting for a teacher</span>
<span style="display:inline-flex;align-items:center;min-height:32px;border-radius:8px;border:1px dashed var(--color-line);color:var(--color-ink-muted);padding:0 12px;font-size:13px">not ready yet — dashed = honest placeholder</span>
</div></body></html>
