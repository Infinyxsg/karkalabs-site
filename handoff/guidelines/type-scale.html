<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--color-paper);font-family:var(--font-sans);color:var(--color-ink)}</style></head><body><div style="display:grid;gap:10px">
<p style="margin:0;font-family:var(--font-display);font-size:var(--text-display);line-height:var(--leading-display);letter-spacing:var(--tracking-display);font-weight:600">Display</p>
<p style="margin:0;font-family:var(--font-display);font-size:var(--text-h2);line-height:var(--leading-h2);letter-spacing:var(--tracking-display);font-weight:600">Heading 2</p>
<p style="margin:0;font-family:var(--font-display);font-size:var(--text-h3);line-height:var(--leading-h3);font-weight:600">Heading 3</p>
<p style="margin:0;font-size:var(--text-lead);line-height:var(--leading-lead)">Lead — the caption track and section intros.</p>
<p style="margin:0;font-size:var(--text-body);line-height:var(--leading-body)">Body — 16px system sans, line-height 1.55.</p>
<p style="margin:0;font-size:var(--text-caption);line-height:var(--leading-caption);color:var(--color-ink-muted)">Caption — 13px, labels and status lines.</p>
<p style="margin:0;font-size:var(--text-eyebrow);font-weight:600;text-transform:uppercase;letter-spacing:var(--tracking-eyebrow);color:var(--color-teal)">Eyebrow — 12px +0.14em</p>
</div></body></html>
