<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--color-paper);font-family:var(--font-sans);color:var(--color-ink)}</style></head><body><div style="display:grid;gap:8px"><div style="display:grid;grid-template-columns:90px 60px 1fr;gap:12px;align-items:center"><span style="font-size:13px;font-weight:600">--dur-instant</span><span style="font-size:13px;color:var(--color-sage-deep);font-weight:600">120ms</span><span style="font-size:12px;color:var(--color-ink-muted)">state colour flips</span></div><div style="display:grid;grid-template-columns:90px 60px 1fr;gap:12px;align-items:center"><span style="font-size:13px;font-weight:600">--dur-fast</span><span style="font-size:13px;color:var(--color-sage-deep);font-weight:600">200ms</span><span style="font-size:12px;color:var(--color-ink-muted)">hovers, caption swaps</span></div><div style="display:grid;grid-template-columns:90px 60px 1fr;gap:12px;align-items:center"><span style="font-size:13px;font-weight:600">--dur-base</span><span style="font-size:13px;color:var(--color-sage-deep);font-weight:600">360ms</span><span style="font-size:12px;color:var(--color-ink-muted)">chips, progress, board fade</span></div><div style="display:grid;grid-template-columns:90px 60px 1fr;gap:12px;align-items:center"><span style="font-size:13px;font-weight:600">--dur-slow</span><span style="font-size:13px;color:var(--color-sage-deep);font-weight:600">600ms</span><span style="font-size:12px;color:var(--color-ink-muted)">larger moves</span></div><div style="display:grid;grid-template-columns:90px 60px 1fr;gap:12px;align-items:center"><span style="font-size:13px;font-weight:600">--dur-reveal</span><span style="font-size:13px;color:var(--color-sage-deep);font-weight:600">800ms</span><span style="font-size:12px;color:var(--color-ink-muted)">section reveals (16px nudge, once)</span></div>
<p style="margin:6px 0 0;font-size:12px;color:var(--color-ink-muted)">ease-karka-out: cubic-bezier(0.22, 1, 0.36, 1) · enters/exits are 6px y-nudges + fade · no bounces</p></div></body></html>
