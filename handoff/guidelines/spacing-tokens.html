<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--color-paper);font-family:var(--font-sans);color:var(--color-ink)}</style></head><body><div style="display:grid;gap:10px"><div style="display:grid;grid-template-columns:110px 1fr 60px;align-items:center;gap:12px"><span style="font-size:13px;font-weight:600">--spacing-gutter</span><span style="height:14px;width:20px;background:var(--color-sage);border-radius:3px;display:block"></span><span style="font-size:12px;color:var(--color-ink-muted)">20px</span></div><div style="display:grid;grid-template-columns:110px 1fr 60px;align-items:center;gap:12px"><span style="font-size:13px;font-weight:600">--spacing-gutter-lg</span><span style="height:14px;width:40px;background:var(--color-sage);border-radius:3px;display:block"></span><span style="font-size:12px;color:var(--color-ink-muted)">40px</span></div><div style="display:grid;grid-template-columns:110px 1fr 60px;align-items:center;gap:12px"><span style="font-size:13px;font-weight:600">--spacing-section</span><span style="height:14px;width:80px;background:var(--color-sage);border-radius:3px;display:block"></span><span style="font-size:12px;color:var(--color-ink-muted)">80px</span></div><div style="display:grid;grid-template-columns:110px 1fr 60px;align-items:center;gap:12px"><span style="font-size:13px;font-weight:600">--spacing-section-lg</span><span style="height:14px;width:128px;background:var(--color-sage);border-radius:3px;display:block"></span><span style="font-size:12px;color:var(--color-ink-muted)">128px</span></div></div></body></html>
