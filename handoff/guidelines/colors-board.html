<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--color-paper);font-family:var(--font-sans);color:var(--color-ink)}.s{flex:1;min-width:100px}.s div{height:60px;border-radius:8px;border:1px solid var(--color-line)}.s p{margin:6px 0 0;font-size:13px;font-weight:600}.s span{font-size:12px;color:var(--color-ink-muted)}</style></head><body>
<div style="display:flex;gap:12px">
<div class="s"><div style="background:#147d7b"></div><p>Board teal</p><span>#147D7B</span></div>
<div class="s"><div style="background:#0f6564"></div><p>Teal deep</p><span>#0F6564</span></div>
<div class="s"><div style="background:linear-gradient(90deg,#1f8673,#2d9269)"></div><p>Active pill</p><span>#1F8673 → #2D9269</span></div>
<div class="s"><div style="background:#eef2f4"></div><p>Scene ground</p><span>#EEF2F4</span></div>
<div class="s"><div style="background:#dfe8ee"></div><p>Scene deep</p><span>#DFE8EE</span></div>
<div class="s"><div style="background:#9fbccd"></div><p>Scene line</p><span>#9FBCCD</span></div>
</div>
</body></html>
