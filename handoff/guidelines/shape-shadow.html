<!-- @dsCard group="Spacing" viewport="700x210" name="Corners & shadow" subtitle="Cards 16px, board 20px, fields 8px, pills everywhere; one shadow, reserved for the board" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--color-paper);font-family:var(--font-sans);color:var(--color-ink)}</style></head><body><div style="display:flex;gap:16px;align-items:flex-start">
<div style="flex:1;background:var(--color-board);border:1px solid var(--color-line);border-radius:var(--radius-card);padding:14px"><p style="margin:0;font-size:13px;font-weight:600">Card</p><p style="margin:2px 0 0;font-size:12px;color:var(--color-ink-muted)">16px · line border, no shadow</p></div>
<div style="flex:1.2;background:var(--color-board);border-radius:var(--radius-board);box-shadow:var(--shadow-board);padding:14px"><p style="margin:0;font-size:13px;font-weight:600">The board</p><p style="margin:2px 0 0;font-size:12px;color:var(--color-ink-muted)">20px · --shadow-board (the only shadow)</p></div>
<div style="flex:1"><input value="Field" readonly style="width:100%;box-sizing:border-box;min-height:48px;border-radius:var(--radius-field);border:1px solid var(--color-line);background:var(--color-paper);padding:0 12px;font-size:15px;color:var(--color-ink)"><span style="display:inline-flex;margin-top:10px;min-height:32px;align-items:center;border-radius:9999px;border:1px solid var(--color-line);background:var(--color-board);padding:0 14px;font-size:13px;font-weight:500">Pill</span></div>
</div></body></html>
