# karkalabs.ai → GitHub Pages (Settings → Pages → Source: GitHub Actions).
# Nothing deploys unless the gate job passes: typecheck + build, the Playwright suite (the build that
# ships, the stand-in frame, and the LIVE /embed/ route on cbsephysics11.karkalabs.ai), and Lighthouse
# mobile (simulated, 3 runs, on the intro and no-intro paths).
#
# The suite reaches the network: the `live-embed` project frames the real route. That is deliberate —
# the Students board IS that route since 040 §C.1, so a deploy claiming it works should not pass while
# it is down. If that coupling ever needs breaking, drop the project with
# `npx playwright test --project=site --project=iphone-safari --project=embed-path`.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Browsers (Chrome for the suite and Lighthouse, WebKit for the iPhone check)
        run: npx playwright install --with-deps chrome webkit

      - name: Typecheck + build (dist/)
        run: npm run build

      - name: Test suite (pretest builds dist-fixture/ for the live-embed path)
        run: npm test

      # Quoted: an unquoted ": " inside a plain scalar starts a nested mapping (invalid YAML).
      # Both paths: a first visit (the intro plays) and a return visit (?no-intro strips the flag
      # script, which is what sessionStorage does on a second load — Lighthouse always opens a fresh
      # tab, so it would otherwise only ever measure the first visit).
      - name: "Lighthouse mobile, simulated, intro + no-intro. Gate: performance ≥ 90, accessibility 100, CLS < 0.1"
        run: |
          node scripts/serve-dist.mjs &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          GATE_DIR=lighthouse-ci npm run gate:lighthouse
          GATE_DIR=lighthouse-ci-no-intro npm run gate:lighthouse "http://localhost:4173/?no-intro"

      - name: Keep the gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence
          path: |
            lighthouse-ci/
            lighthouse-ci-no-intro/
            docs/gate/
            test-results/
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
